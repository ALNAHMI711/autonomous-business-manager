services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./browser_profiles:/app/browser_profiles
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Optional reverse proxy. Put TLS termination here when a domain is available.
  # Do not expose port 8000 publicly in production; restrict it with the cloud firewall.
