name: Engineering Bootstrap

on:
  push:
    branches:
      - codex/engineering-network-v3
  pull_request:
    branches:
      - main
  workflow_dispatch:

# This workflow is validation-only. It must never receive repository write access
# or mutate branches automatically.
permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Validate engineering patch script
        run: python -m compileall -q scripts/bootstrap_engineering.py

      - name: Compile check
        run: python -m compileall -q app

      - name: Unit tests
        run: pytest -q
