name: Integrate security headers

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.head_commit.message != 'chore: remove one-shot security headers workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch main
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/main.py')
          s=p.read_text()
          imp='from app.security_headers import SecurityHeadersMiddleware\n'
          anchor='from app.security import SecurityManager\n'
          if imp not in s:
              s=s.replace(anchor, anchor+imp, 1)
          marker='app = FastAPI(\n'
          if 'SecurityHeadersMiddleware' not in s[s.index(marker):]:
              needle='    lifespan=lifespan,\n)\n'
              if needle not in s: raise SystemExit('FastAPI anchor not found')
              s=s.replace(needle, needle+'\napp.add_middleware(SecurityHeadersMiddleware)\n',1)
          p.write_text(s)
          PY
      - name: Validate
        run: |
          python -m pip install -r requirements.txt pytest
          python -m compileall -q app
          pytest -q
      - name: Commit and remove workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/main.py app/security_headers.py
          git commit -m 'security: enable browser security headers' || true
          rm -f .github/workflows/integrate-security-headers.yml
          git add .github/workflows/integrate-security-headers.yml
          git commit -m 'chore: remove one-shot security headers workflow' || true
          git push
